name: sync-published-site

# Synchronise l'integralite du site publie (interface + code + assets)
# dans ce depot prive : HTML, CSS, modules JS, ressources referencees
# par le HTML et par le CSS (polices, images, svg).
# Tourne a chaque push, a la demande, et chaque nuit a 04:00 UTC :
# chaque modification du projet est donc archivee.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger l'interface et toutes les ressources
        run: |
          set -uo pipefail
          BASE="https://site-69d99fb9841c47e8bfd4dda067302ad1.freebuff.page"

          fetch() {
            u="$1"; out="$2"
            mkdir -p "$(dirname "$out")"
            if curl -fsSL "$BASE/$u" -o "$out.tmp"; then
              mv "$out.tmp" "$out"
              echo "ok $out"
            else
              rm -f "$out.tmp"
              echo "absent $out"
            fi
          }

          fetch "" index.html

          # 1. ressources referencees par le HTML (css, scripts, images)
          grep -oE '(src|href)="[^"]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u > /tmp/html-assets.txt
          cat /tmp/html-assets.txt
          while read -r p; do
            case "$p" in http*|\#*|data:*|mailto:*|"") continue ;; esac
            p="${p#./}"; p="${p#/}"
            [ -z "$p" ] && continue
            fetch "$p" "$p"
          done < /tmp/html-assets.txt

          # 2. ressources referencees par le CSS (polices, images, svg)
          if [ -f styles.css ]; then
            grep -oE 'url\([^)]*\)' styles.css | sed -e 's/^url(//' -e 's/)$//' -e "s/^[\"']//" -e "s/[\"']$//" | sort -u > /tmp/css-assets.txt
            cat /tmp/css-assets.txt
            while read -r p; do
              case "$p" in http*|data:*|"") continue ;; esac
              p="${p#./}"; p="${p#/}"
              [ -z "$p" ] && continue
              fetch "$p" "$p"
            done < /tmp/css-assets.txt
          fi

          # 3. modules connus, meme s'ils ne sont pas references dans le HTML
          for f in app.js lua54.js decompile.js recover.js fxap.js deobf.js anti.js nui.js sanitize.js zip.js records.js accounts.js island.js styles.css; do
            [ -f "$f" ] || fetch "$f" "$f"
          done

          echo "--- fichiers presents ---"
          find . -path ./.git -prune -o -type f -print | sort
          du -sh --exclude=.git .

      - name: Commiter chaque modification
        run: |
          git config user.name "CypherDev121"
          git config user.email "lykoslegoatdev@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement depuis la derniere synchronisation"
          else
            git commit -m "sync: mise a jour du site publie $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
