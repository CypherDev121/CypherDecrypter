name: recover-published-sources

# Telecharge les fichiers sources servis par le site publie et les commite
# dans ce depot prive. Aucune machine locale n'est necessaire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger les sources publiees
        run: |
          set -uo pipefail
          BASE="https://site-69d99fb9841c47e8bfd4dda067302ad1.freebuff.page"
          curl -fsSL "$BASE/" -o index.html
          echo "--- index.html ---"
          wc -c index.html

          grep -oE '(src|href)="[^"]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u > /tmp/assets.txt
          cat /tmp/assets.txt

          while read -r p; do
            case "$p" in
              http*|\#*|data:*|mailto:*|"") continue ;;
            esac
            p="${p#./}"
            p="${p#/}"
            [ -z "$p" ] && continue
            mkdir -p "$(dirname "$p")"
            if curl -fsSL "$BASE/$p" -o "$p"; then
              echo "ok $p"
            else
              echo "skip $p"
              rm -f "$p"
            fi
          done < /tmp/assets.txt

          # modules connus, meme s'ils ne sont pas references dans le HTML
          for f in app.js lua54.js fxap.js recover.js deobf.js anti.js zip.js records.js accounts.js style.css admin.js admin.css; do
            if [ ! -f "$f" ]; then
              if curl -fsSL "$BASE/$f" -o "$f"; then echo "ok $f"; else echo "absent $f"; rm -f "$f"; fi
            fi
          done

          # source maps eventuelles
          for f in app.js.map style.css.map; do
            curl -fsSL "$BASE/$f" -o "$f" && echo "ok $f" || rm -f "$f"
          done

          ls -la
          echo "--- tailles ---"
          wc -c *.html *.js *.css 2>/dev/null || true

      - name: Commiter les sources recuperees
        run: |
          git config user.name "CypherDev121"
          git config user.email "lykoslegoatdev@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a commiter"
          else
            git commit -m "chore: recuperation des sources publiees du site [skip ci]"
            git push
          fi
