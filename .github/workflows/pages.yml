name: deploy-pages

# Publie le site sur GitHub Pages a chaque push sur main :
# https://cypherdev121.github.io/CypherDecrypter/
# Le site est le meme code que l'app de bureau : il est compile par Vite
# (src/main.ts embarque les modules js/) puis dist/ est deploye.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Activer Pages si necessaire
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparer le site
        run: |
          set -uo pipefail
          mkdir -p _site
          cp -r dist/. _site/

          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ -z "$VERSION" ] && VERSION="0.0.0"

          # Pastille de version : alignee sur le fichier VERSION.
          if grep -q 'data-site-version' _site/index.html; then
            sed -i -E "s#data-site-version=\"[^\"]*\"#data-site-version=\"v$VERSION\"#g" _site/index.html
            sed -i -E "s#(data-site-version=\"v$VERSION\"[^>]*>)v[0-9][^<]*#\\1v$VERSION#g" _site/index.html
            echo "badge existant aligne sur v$VERSION"
          else
            echo "BADGE ABSENT dans dist/index.html"
          fi

          echo "--- contenu publie ---"
          find _site -type f | sort

      - name: Empaqueter
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployer
        id: deployment
        uses: actions/deploy-pages@v4
