name: deploy-pages

# Publie le site sur GitHub Pages a chaque push sur main :
# https://cypherdev121.github.io/CypherDecrypter/
# Aucun build : les fichiers sont deja statiques (index.html, js/, css/, assets/).
#
# C'est ici que la version et le module de correctifs sont injectes, pas dans le
# depot : sync-site.yml retelescharge index.html et js/*.js depuis la source
# publiee, donc toute modification faite dans ces fichiers serait ecrasee.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activer Pages si necessaire
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparer le site
        run: |
          set -uo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -r js css assets _site/

          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ -z "$VERSION" ] && VERSION="0.0.0"

          # Pastille de version : alignee sur le fichier VERSION.
          if grep -q 'data-site-version' _site/index.html; then
            sed -i -E "s#data-site-version=\"[^\"]*\"#data-site-version=\"v$VERSION\"#g" _site/index.html
            sed -i -E "s#(data-site-version=\"v$VERSION\"[^>]*>)v[0-9][^<]*#\\1v$VERSION#g" _site/index.html
            echo "badge existant aligne sur v$VERSION"
          else
            sed -i "s#<span class=\"badge badge-azure\">Lua 5.4</span>#&<span class=\"badge badge-azure\" data-site-version=\"v$VERSION\" title=\"Version du site\">v$VERSION</span>#" _site/index.html
            echo "badge insere en v$VERSION"
          fi

          # Correctifs : charges en dernier, apres app.js, pour que Recover et
          # Zip existent deja quand le module s'evalue.
          if ! grep -q 'js/compat.js' _site/index.html; then
            sed -i 's#<script src="js/app\.js"></script>#&\n<script src="js/compat.js"></script>#' _site/index.html
            echo "module de correctifs injecte apres app.js"
          else
            echo "module de correctifs deja present"
          fi

          echo "--- controle ---"
          grep -o 'data-site-version="[^"]*"' _site/index.html || echo "BADGE ABSENT"
          grep -n 'src="js/.*\.js"' _site/index.html || true
          test -f _site/js/compat.js || { echo "compat.js MANQUANT"; exit 1; }
          echo "--- contenu publie ---"
          find _site -type f | sort

      - name: Empaqueter
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployer
        id: deployment
        uses: actions/deploy-pages@v4
