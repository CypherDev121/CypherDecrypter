name: sync-site

# Synchronise le site publie dans ce depot prive, le range par type, et
# injecte le numero de version lu dans le fichier VERSION.
# Declencheurs : push sur main, manuel, et chaque nuit a 04:00 UTC.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger, reorganiser et versionner
        run: |
          set -uo pipefail
          BASE="https://site-69d99fb9841c47e8bfd4dda067302ad1.freebuff.page"

          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "Version lue dans VERSION : $VERSION"

          mkdir -p js css assets/brand

          fetch() {
            u="$1"; out="$2"
            mkdir -p "$(dirname "$out")"
            if curl -fsSL "$BASE/$u" -o "$out.tmp"; then
              mv "$out.tmp" "$out"
              echo "ok $out"
            else
              rm -f "$out.tmp"
              echo "absent $out"
            fi
          }

          fetch "" index.html
          fetch "styles.css" css/styles.css

          for f in app lua54 decompile recover fxap deobf anti nui sanitize zip records accounts island; do
            fetch "$f.js" "js/$f.js"
          done

          for s in freebuff github google microsoft; do
            fetch "brand/$s.svg" "assets/brand/$s.svg"
          done

          # La source publiee a ses chemins a plat : on les reecrit.
          sed -i -E \
            -e 's#(src|href)="\./#\1="#g' \
            -e 's#(src|href)="(app|lua54|decompile|recover|fxap|deobf|anti|nui|sanitize|zip|records|accounts|island)\.js"#\1="js/\2.js"#g' \
            -e 's#(src|href)="styles\.css"#\1="css/styles.css"#g' \
            -e 's#(src|href)="brand/#\1="assets/brand/#g' \
            index.html

          # Badge de version dans l'en-tete, juste apres le badge "Lua 5.4".
          # Idempotent : le HTML est retelecharge a chaque passage.
          if ! grep -q 'data-site-version' index.html; then
            sed -i "s#<span class=\"badge badge-azure\">Lua 5.4</span>#&<span class=\"badge badge-azure\" data-site-version=\"v$VERSION\" title=\"Version du site\">v$VERSION</span>#" index.html
          fi

          # Verification : chaque reference locale doit exister sur disque.
          grep -oE '(src|href)="[^"]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u | while read -r p; do
            case "$p" in http*|data:*|\#*|"") continue ;; esac
            p="${p#/}"
            if [ -f "$p" ]; then echo "reference ok : $p"; else echo "MANQUANT : $p"; fi
          done > /tmp/check.txt

          {
            echo "Site source : $BASE/"
            echo "Version : v$VERSION"
            echo ""
            echo "Badge de version dans le HTML :"
            grep -o 'data-site-version="[^"]*"' index.html || echo "ABSENT"
            echo ""
            echo "Balises script :"
            grep -oE '<script[^>]*>' index.html || true
            echo ""
            echo "Verification des references :"
            cat /tmp/check.txt
            echo ""
          } > SYNC.txt

          if grep -q '^MANQUANT' /tmp/check.txt; then
            echo "ATTENTION : reference non resolue, anciens fichiers a plat conserves" | tee -a SYNC.txt
          else
            for f in *.js styles.css; do
              [ -e "$f" ] || continue
              git rm -q --ignore-unmatch "$f"
            done
            if [ -d brand ]; then
              git rm -rq --ignore-unmatch brand
            fi
            {
              echo "Arborescence finale (octets, chemin) :"
              find . -path ./.git -prune -o -type f ! -name SYNC.txt -print | sed 's|^\./||' | sort | while read -r f; do
                printf '%8s  %s\n' "$(wc -c < "$f")" "$f"
              done
            } >> SYNC.txt
          fi

          cat SYNC.txt

      - name: Commiter chaque modification
        run: |
          git config user.name "CypherDev121"
          git config user.email "lykoslegoatdev@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement depuis la derniere synchronisation"
          else
            V="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 0.0.0)"
            git commit -m "sync: site publie v$V ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
            git push
          fi
