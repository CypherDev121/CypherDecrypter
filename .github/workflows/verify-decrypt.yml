name: verify-decrypt

# Verifie sans navigateur : lecture et decompilation d'un vrai .luac 5.4,
# AES-ECB (doit rendre exactement le clair), AES-CBC (doit rester intact),
# puis le filtre d'export sans escrow. Le harnais vit dans
# tests/verify-decrypt.cjs pour que le journal du job reste court et lisible
# (un bloc `run` multiligne est recopie en entier dans le log).
on:
  workflow_dispatch:
  push:
    paths:
      - 'js/compat.js'
      - 'js/recover.js'
      - 'js/lua54.js'
      - 'js/decompile.js'
      - 'js/zip.js'
      - 'tests/verify-decrypt.cjs'
      - '.github/workflows/verify-decrypt.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4

      - name: Compiler un chunk de reference
        run: |
          printf 'local n = 0\nfor i = 1, 3 do n = n + i end\nprint("hi", n)\n' > /tmp/a.lua
          luac5.4 -o /tmp/a.luac /tmp/a.lua
          ls -l /tmp/a.luac

      - name: Tests
        run: node tests/verify-decrypt.cjs
